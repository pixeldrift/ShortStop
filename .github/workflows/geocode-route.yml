name: Refresh geocoded waypoints

# Fires only when route-125.csv itself changes - the one source of
# truth for the route (see README, "Maps, part two"). The job's own
# commit below only ever touches route-125-waypoints.json, never
# route-125.csv, so it can't re-trigger this workflow on itself.
on:
  push:
    branches:
      - main
      - claude/ipad-iphone-nav-app-ss8dsk
    paths:
      - "public/data/route-125.csv"
  # Temporary, for testing the User-Agent fix in geocode.ts without a
  # CSV change - remove once confirmed one way or the other.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Refresh route-125-waypoints.json
        run: npm run geocode

      - name: Commit and push if the cache changed
        run: |
          if git diff --quiet -- public/data/route-125-waypoints.json; then
            echo "No waypoint changes - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/route-125-waypoints.json
          git commit -m "Refresh geocoded waypoints

          Auto-generated by npm run geocode after a change to
          public/data/route-125.csv."
          git push origin HEAD:${{ github.ref }}
