name: Refresh geocoded waypoints

# Fires on any change under public/data/*.csv - every route's own
# turn-by-turn steps sheet (see README, "Maps, part two"), schools.csv
# (a school's address feeds deriveWaypoints too - see geocodeRoute.ts),
# and route-master-list.csv itself (which routes are "active", and each
# one's routeNumber/am_pm/school_type - see stepsCsvBaseName,
# parseRouteMasterList.ts - decide which steps sheet gets processed at
# all). The job's own commit below only ever touches each route's own
# *-waypoints.json sidecar file, never a .csv, so it can't re-trigger
# this workflow on itself.
on:
  push:
    branches:
      - main
      - claude/ipad-iphone-nav-app-ss8dsk
    paths:
      - "public/data/*.csv"
  # Kept (not just for the User-Agent test it was added for) so a run
  # can be triggered manually - e.g. once ORS_API_KEY is first added
  # as a repository secret, to confirm the switch to OpenRouteService
  # works without needing an unrelated CSV edit.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Refresh every active route's waypoint cache
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: npm run geocode

      - name: Commit and push if any cache changed
        run: |
          git add public/data/*-waypoints.json
          if git diff --cached --quiet; then
            echo "No waypoint changes - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh geocoded waypoints

          Auto-generated by npm run geocode after a change under
          public/data/*.csv."
          git push origin HEAD:${{ github.ref }}
