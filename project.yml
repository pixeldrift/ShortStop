name: ShortStop
options:
  bundleIdPrefix: com.pixeldrift
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ShortStop:
    type: application
    platform: iOS
    sources:
      - path: ShortStopApp
        excludes:
          - Info.plist
    info:
      path: ShortStopApp/Info.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.pixeldrift.shortstop
